<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>GLOBAL SOUND 24｜睡眠音效測試 V6</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0d;color:#f5f0e7;font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:22px 15px 40px}.wrap{max-width:620px;margin:auto}.brand{text-align:center;color:#cbb181;letter-spacing:.14em;font-size:12px}.brand b{display:block;font-size:21px;color:#fff;margin-bottom:5px}.note{font-size:13px;line-height:1.6;color:#b7b1a7}.record{width:220px;height:220px;border-radius:50%;margin:24px auto;background:repeating-radial-gradient(circle,#101010 0 4px,#252525 5px 6px,#101010 7px 10px);display:grid;place-items:center;box-shadow:0 0 0 7px #191919}.label{border-radius:50%;width:84px;height:84px;background:radial-gradient(circle,#d9c08f,#695333);display:grid;place-items:center;text-align:center;font:12px Georgia;color:#17130d}.playing{animation:spin 5s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}h1{text-align:center;font-size:23px;font-weight:500}.status{text-align:center;white-space:pre-line;color:#d3bd92;font-size:13px;min-height:42px;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:20px 0}.sound,button{font:inherit;cursor:pointer}.sound{background:#19191b;color:#eee;border:1px solid #3b3831;border-radius:12px;padding:14px;text-align:left}.sound.active{border-color:#d3b67e;background:#282319}.sound small{display:block;color:#aaa;font-size:11px;margin-top:5px}.controls{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.btn{border:1px solid #8d754b;background:#cfb17b;color:#17130d;border-radius:25px;padding:13px;font-weight:650}.btn.alt{background:#19191b;color:#f5f0e7;border-color:#49443a}.row{margin-top:18px;padding:14px;background:#171719;border-radius:12px;display:flex;gap:12px;align-items:center;justify-content:space-between;font-size:13px}.row input{width:54%}.fine{font-size:11px;line-height:1.6;color:#918a7d;margin-top:18px}audio{display:none}
</style></head><body><main class="wrap"><div class="brand"><b>GLOBAL SOUND 24</b>SLEEP AUDIO ENGINE · V6</div><p class="note">這版改用 iPhone Safari 原生 audio 播放路徑，不使用 AudioContext。先用內建短音測試音訊輸出，再測試音景。此版本仍是合成測試聲，不是真實雨聲／海浪錄音。</p><div class="record" id="record"><div class="label">GLOBAL<br>SOUND 24</div></div><h1 id="title">白噪音</h1><div class="status" id="status">請按「播放測試音」</div><div class="grid"><button class="sound active" data-kind="white">◉ 白噪音<small>寬頻合成聲</small></button><button class="sound" data-kind="pink">◉ 粉紅噪音<small>較柔和合成聲</small></button><button class="sound" data-kind="brown">◉ 棕噪音<small>偏低頻合成聲</small></button><button class="sound" data-kind="rain">☂ 雨聲感<small>合成示範，非錄音</small></button><button class="sound" data-kind="wind">〰 微風感<small>合成示範，非錄音</small></button><button class="sound" data-kind="ocean">≈ 海浪感<small>合成示範，非錄音</small></button></div><div class="controls"><button class="btn" id="test">🔊 播放測試音</button><button class="btn" id="play">▶ 開始音景</button><button class="btn alt" id="pause">Ⅱ 暫停</button><button class="btn alt" id="stop">■ 停止</button></div><div class="row"><label for="volume">音量</label><input id="volume" type="range" min="0" max="1" step=".05" value=".6"></div><div class="row"><label for="timer">睡眠定時</label><select id="timer"><option value="0">關閉</option><option value="30">30 分鐘</option><option value="60">1 小時</option><option value="120">2 小時</option><option value="240">4 小時</option><option value="480">8 小時</option></select></div><audio id="player" loop playsinline preload="auto"></audio><div class="fine">V6 技術修正：使用原生 HTMLAudioElement 播放由頁面產生的 WAV 資料。若測試音仍無聲，請確認網址是在 Safari 開啟、iPhone 媒體音量已調高，且音訊未輸出到藍牙耳機／AirPlay。此頁不是正式音源版。</div></main><script>
(()=>{const $=id=>document.getElementById(id);let kind='white',timer=null,playing=false;const names={white:'白噪音',pink:'粉紅噪音',brown:'棕噪音',rain:'雨聲感',wind:'微風感',ocean:'海浪感'};function setStatus(t){$('status').textContent=t+'\n播放狀態：'+(playing?'播放中':'未播放')+'｜音量：'+Math.round(+$('volume').value*100)+'%'}function wavData(freq=660,duration=1,noise=false){const sr=22050,n=Math.floor(sr*duration),buf=new ArrayBuffer(44+n*2),v=new DataView(buf);const str=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};str(0,'RIFF');v.setUint32(4,36+n*2,true);str(8,'WAVE');str(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);str(36,'data');v.setUint32(40,n*2,true);let last=0;for(let i=0;i<n;i++){let x;if(noise){const r=Math.random()*2-1;if(kind==='pink'||kind==='rain'){last=.97*last+.12*r;x=last*1.6+r*.18}else if(kind==='brown'||kind==='ocean'){last=(last+.035*r)/1.035;x=last*2.5}else if(kind==='wind'){last=.985*last+.07*r;x=last*2.3}else x=r*.6;}else{x=Math.sin(2*Math.PI*freq*i/sr)*.5*Math.min(1,i/(sr*.03),(n-i)/(sr*.04));}x=Math.max(-.95,Math.min(.95,x));v.setInt16(44+i*2,x*32767,true)}let bytes=new Uint8Array(buf),bin='';for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode(...bytes.subarray(i,Math.min(i+0x8000,bytes.length)));return 'data:audio/wav;base64,'+btoa(bin)}function loadNoise(){const p=$('player');p.pause();p.src=wavData(0,5,true);p.loop=true;p.load()}async function start(){try{loadNoise();$('player').volume=+$('volume').value;await $('player').play();playing=true;$('record').classList.add('playing');setStatus('音景已啟動：'+names[kind]);if(timer)clearTimeout(timer);let m=+$('timer').value;if(m)timer=setTimeout(stop,m*60000)}catch(e){playing=false;setStatus('播放失敗：'+e.name+' / '+e.message)}}function stop(){const p=$('player');p.pause();p.currentTime=0;playing=false;$('record').classList.remove('playing');if(timer)clearTimeout(timer);timer=null;setStatus('已停止')}document.querySelectorAll('.sound').forEach(b=>b.addEventListener('click',()=>{kind=b.dataset.kind;document.querySelectorAll('.sound').forEach(x=>x.classList.toggle('active',x===b));$('title').textContent=names[kind];setStatus('已選擇 '+names[kind]+'，按開始音景');}));$('test').addEventListener('click',async()=>{try{const p=$('player');p.pause();p.loop=false;p.src=wavData(660,1,false);p.volume=+$('volume').value;p.load();await p.play();playing=true;$('record').classList.add('playing');setStatus('正在播放 660 Hz 測試音，約 1 秒');p.onended=()=>{playing=false;$('record').classList.remove('playing');setStatus('測試音播放結束；若沒聽到，請確認 Safari／媒體音量／音訊輸出')};}catch(e){setStatus('測試音失敗：'+e.name+' / '+e.message)}});$('play').addEventListener('click',start);$('pause').addEventListener('click',()=>{const p=$('player');if(p.paused){p.play().then(()=>{playing=true;$('record').classList.add('playing');setStatus('繼續播放：'+names[kind])}).catch(e=>setStatus('恢復失敗：'+e.message))}else{p.pause();playing=false;$('record').classList.remove('playing');setStatus('已暫停')}});$('stop').addEventListener('click',stop);$('volume').addEventListener('input',()=>{$('player').volume=+$('volume').value;setStatus('音量已調整')});$('timer').addEventListener('change',()=>{if(timer)clearTimeout(timer);let m=+$('timer').value;if(playing&&m)timer=setTimeout(stop,m*60000)});})();
</script></body></html>
