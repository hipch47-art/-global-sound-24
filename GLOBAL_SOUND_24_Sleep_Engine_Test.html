<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GLOBAL SOUND 24｜睡眠音景引擎測試</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#25231f,#090a0d 58%);color:#f3eee4;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:22px 16px 40px}.wrap{max-width:760px;margin:auto}.brand{letter-spacing:.16em;font-size:12px;color:#c6aa79}.brand b{font-size:20px;color:#fff;display:block;letter-spacing:.09em;margin-bottom:5px}.sub{color:#a8a39a;font-size:13px;line-height:1.6}.recordbox{display:flex;justify-content:center;margin:24px 0 18px}.record{width:min(66vw,270px);aspect-ratio:1;border-radius:50%;background:repeating-radial-gradient(circle,#111 0 3px,#292929 4px 5px,#101010 6px 8px);box-shadow:0 0 0 8px #171717,0 18px 50px #000;display:grid;place-items:center;position:relative}.record:before{content:"";position:absolute;inset:35%;border-radius:50%;background:radial-gradient(circle,#d7bd88,#5d482b 70%,#171717 72%);border:3px solid #b79a64}.label{z-index:1;text-align:center;font-family:Georgia,serif;font-size:13px;letter-spacing:.08em;color:#fff}.record.playing{animation:spin 5s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}h1{font-size:23px;margin:12px 0 5px;text-align:center;font-weight:550}.now{text-align:center;color:#c6aa79;font-size:13px;min-height:20px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:22px 0}.sound{background:#191a1d;border:1px solid #37332c;color:#eee8dc;border-radius:14px;padding:15px 12px;text-align:left;font-size:15px;min-height:68px}.sound small{display:block;color:#a6a098;font-size:11px;margin-top:5px}.sound.active{border-color:#c6aa79;background:#27231c}.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0}.btn{border:1px solid #7e6a48;background:#c6aa79;color:#16130e;border-radius:999px;padding:12px 20px;font-size:14px;font-weight:650}.btn.secondary{background:#1a1a1a;color:#eee8dc;border-color:#444}.panel{background:#151619;border:1px solid #34302a;border-radius:16px;padding:15px;margin-top:16px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:10px 0;color:#d7d0c4;font-size:13px}.row input{width:54%;accent-color:#c6aa79}.license{font-size:11px;color:#9e9688;text-align:center;margin-top:18px}.notice{font-size:12px;color:#aaa398;line-height:1.65}.status{height:4px;background:#302d28;border-radius:4px;overflow:hidden;margin:14px 0}.status span{display:block;height:100%;width:0;background:#c6aa79;transition:width .2s}@media(max-width:420px){body{padding:18px 13px}.grid{gap:8px}.sound{padding:13px 10px}}
</style></head><body><main class="wrap"><div class="brand"><b>GLOBAL SOUND 24</b>AMBIENT ENGINE · TEST BUILD</div><p class="sub">睡眠音景引擎測試版｜先驗證裝置端即時合成、播放控制與音量變化；不取代正式網站。</p><div class="recordbox"><div class="record" id="record"><div class="label">GLOBAL<br>SOUND 24</div></div></div><h1 id="title">選擇睡眠聲音</h1><div class="now" id="status">尚未播放</div><div class="grid">
<button class="sound" data-kind="white">◉ 白噪音<small>裝置即時合成</small></button><button class="sound" data-kind="pink">◉ 粉紅噪音<small>裝置即時合成</small></button><button class="sound" data-kind="brown">◉ 棕噪音<small>裝置即時合成</small></button><button class="sound" data-kind="rain">☂ 雨聲氛圍<small>合成雨滴質感（示範）</small></button><button class="sound" data-kind="wind">〰 微風氛圍<small>合成風聲質感（示範）</small></button><button class="sound" data-kind="ocean">≈ 海浪氛圍<small>合成緩慢起伏（示範）</small></button></div><div class="controls"><button class="btn" id="play">▶ 開始播放</button><button class="btn secondary" id="stop">■ 停止</button></div><div class="panel"><div class="row"><label for="volume">播放音量</label><input id="volume" type="range" min="0" max="0.7" step="0.01" value="0.22"></div><div class="row"><label for="variation">自然變化幅度</label><input id="variation" type="range" min="0" max="100" value="35"></div><div class="row"><label for="timer">睡眠定時</label><select id="timer" style="background:#222;color:#eee;border:1px solid #49433a;border-radius:8px;padding:7px"><option value="0">關閉</option><option value="30">30 分鐘</option><option value="60">1 小時</option><option value="120">2 小時</option><option value="240">4 小時</option><option value="480">8 小時</option></select></div><div class="status"><span id="progress"></span></div><p class="notice">注意：雨聲、微風、海浪目前是即時合成的技術示範，不是真實環境錄音，也不是 AI 生成音檔。這個測試版用來確認音景引擎方向；iPhone 背景播放、鎖定螢幕及長時間穩定性仍需在正式整合後測試。</p></div><div class="license">SYNTHESIZED AUDIO · NO EXTERNAL MUSIC FILES · TEST ONLY</div></main><script>
let ctx=null,master=null,source=null,filter=null,lfo=null,lfoGain=null,noiseBuffer=null,timerId=null,active='white',playing=false,variationTimer=null,sleepTimer=null,startedAt=0;const labels={white:'白噪音',pink:'粉紅噪音',brown:'棕噪音',rain:'雨聲氛圍',wind:'微風氛圍',ocean:'海浪氛圍'};
function makeNoiseBuffer(){const len=ctx.sampleRate*4,b=ctx.createBuffer(1,len,ctx.sampleRate),d=b.getChannelData(0);let last=0;for(let i=0;i<len;i++){let w=Math.random()*2-1;if(active==='pink'){last=.985*last+.055*w;d[i]=last*3.2}else if(active==='brown'){last=(last+.018*w)/1.018;d[i]=last*3.5}else{d[i]=w}}return b}
function cleanup(){if(source){try{source.stop()}catch(e){}try{source.disconnect()}catch(e){}source=null}if(lfo){try{lfo.stop()}catch(e){}try{lfo.disconnect()}catch(e){}lfo=null}if(lfoGain){try{lfoGain.disconnect()}catch(e){}lfoGain=null}if(filter){try{filter.disconnect()}catch(e){}filter=null}if(variationTimer){clearInterval(variationTimer);variationTimer=null}if(sleepTimer){clearTimeout(sleepTimer);sleepTimer=null}}
function start(){const C=window.AudioContext||window.webkitAudioContext;if(!C){alert('此瀏覽器不支援 Web Audio API');return}if(!ctx)ctx=new C();if(ctx.state==='suspended')ctx.resume();cleanup();active=document.querySelector('.sound.active')?.dataset.kind||active;master=ctx.createGain();master.gain.value=Number(document.getElementById('volume').value);master.connect(ctx.destination);source=ctx.createBufferSource();source.buffer=makeNoiseBuffer();source.loop=true;filter=ctx.createBiquadFilter();filter.type='lowpass';filter.frequency.value=active==='brown'?450:active==='pink'?1800:active==='rain'?5200:active==='wind'?900:active==='ocean'?1100:15000;source.connect(filter);filter.connect(master);if(['rain','wind','ocean'].includes(active)){lfo=ctx.createOscillator();lfo.type='sine';lfo.frequency.value=active==='ocean'?.07:active==='wind'?.11:.17;lfoGain=ctx.createGain();lfoGain.gain.value=Number(document.getElementById('variation').value)/100*.12; lfo.connect(lfoGain);lfoGain.connect(master.gain);lfo.start()}source.start();playing=true;startedAt=Date.now();document.getElementById('record').classList.add('playing');document.getElementById('play').textContent='Ⅱ 暫停播放';document.getElementById('status').textContent='播放中 · '+labels[active]+'（即時合成）';variationTimer=setInterval(()=>{if(!playing||!filter)return;const v=Number(document.getElementById('variation').value)/100;const base=active==='brown'?450:active==='pink'?1800:active==='rain'?5200:active==='wind'?900:active==='ocean'?1100:15000;filter.frequency.setTargetAtTime(base*(.72+Math.random()*.56*v),ctx.currentTime,2);master.gain.setTargetAtTime(Number(document.getElementById('volume').value)*(.92+Math.random()*.16*v),ctx.currentTime,3)},6500);const mins=Number(document.getElementById('timer').value);if(mins)sleepTimer=setTimeout(stop,mins*60000);document.getElementById('progress').style.width='100%'}
function stop(){cleanup();playing=false;if(master){try{master.disconnect()}catch(e){}master=null}document.getElementById('record').classList.remove('playing');document.getElementById('play').textContent='▶ 開始播放';document.getElementById('status').textContent='已停止';document.getElementById('progress').style.width='0%'}
document.querySelectorAll('.sound').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.sound').forEach(x=>x.classList.remove('active'));b.classList.add('active');active=b.dataset.kind;document.getElementById('title').textContent=labels[active];if(playing)start()}));document.querySelector('[data-kind="white"]').classList.add('active');document.getElementById('play').addEventListener('click',()=>{if(playing){if(ctx)ctx.suspend();playing=false;document.getElementById('record').classList.remove('playing');document.getElementById('play').textContent='▶ 繼續播放';document.getElementById('status').textContent='已暫停'}else if(ctx&&ctx.state==='suspended'&&source){ctx.resume();playing=true;document.getElementById('record').classList.add('playing');document.getElementById('play').textContent='Ⅱ 暫停播放';document.getElementById('status').textContent='播放中 · '+labels[active]}else start()});document.getElementById('stop').addEventListener('click',stop);document.getElementById('volume').addEventListener('input',e=>{if(master&&ctx)master.gain.setTargetAtTime(Number(e.target.value),ctx.currentTime,.08)});document.getElementById('variation').addEventListener('input',e=>{if(lfoGain&&ctx)lfoGain.gain.setTargetAtTime(Number(e.target.value)/100*.12,ctx.currentTime,.1)});document.getElementById('timer').addEventListener('change',()=>{if(playing){if(sleepTimer)clearTimeout(sleepTimer);let m=Number(document.getElementById('timer').value);if(m)sleepTimer=setTimeout(stop,m*60000)}});
</script></body></html>
