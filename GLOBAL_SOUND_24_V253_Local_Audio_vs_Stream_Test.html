<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GLOBAL SOUND 24｜V253 音訊路徑測試</title>
<style>
:root{color-scheme:dark}body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#101116;color:#f4f4f6;margin:0;padding:18px;line-height:1.5}main{max-width:720px;margin:auto}h1{font-size:23px}.card{background:#1b1d25;border:1px solid #343643;border-radius:14px;padding:15px;margin:14px 0}button,a.btn{display:inline-block;background:#d9b18c;color:#17151a;border:0;border-radius:10px;padding:11px 12px;font-size:15px;font-weight:650;margin:4px;text-decoration:none}button.alt,a.alt{background:#343643;color:#fff}audio{width:100%;margin:10px 0}p,.hint{color:#b9bac5}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#090a0e;padding:12px;border-radius:10px;max-height:300px;overflow:auto;font-size:12px}.status{font-weight:700;color:#e4bd97}
</style></head><body><main><h1>GLOBAL SOUND 24｜V253 音訊路徑測試</h1><p>目的：先確認 iPhone 網頁的本機音訊輸出，再比較遠端串流。每次只測一項，避免切換音源互相中斷。</p>
<div class="card"><h2>測試 1｜本機測試音</h2><p>不連外部音源，直接由瀏覽器產生 440 Hz 測試音，按下後應立即聽到嗶聲；再按停止。</p><button onclick="startTone()">播放測試音</button><button class="alt" onclick="stopTone()">停止測試音</button><div id="toneStatus" class="status">尚未測試</div></div>
<div class="card"><h2>測試 2｜內嵌串流播放器</h2><audio id="player" controls playsinline preload="none"></audio><button onclick="setStream('Fluid','https://ice1.somafm.com/fluid-128-aac')">載入 Fluid</button><button onclick="setStream('Seven Inch Soul','https://ice1.somafm.com/7soul-128-aac')">載入 Seven Inch Soul</button><p>載入後，請按播放器自己的播放鍵，只測一個音源。最多觀察 5 秒。</p><div id="streamStatus" class="status">尚未測試</div></div>
<div class="card"><h2>測試 3｜直接開啟音源</h2><p>這會在新分頁直接開啟同一音源，用來對照內嵌播放器。若直接播放成功、內嵌失敗，請記錄這個差異。</p><a class="btn" href="https://ice1.somafm.com/fluid-128-aac" target="_blank" rel="noopener">直接開啟 Fluid</a><a class="btn alt" href="https://ice1.somafm.com/7soul-128-aac" target="_blank" rel="noopener">直接開啟 Seven Inch Soul</a></div>
<div class="card"><h2>診斷紀錄</h2><button class="alt" onclick="copyLog()">複製診斷紀錄</button><button class="alt" onclick="clearLog()">清除紀錄</button><pre id="log"></pre></div>
<script>
let ctx=null,osc=null,gain=null;const p=document.getElementById('player'),logEl=document.getElementById('log');let rows=[];
function log(s){const line=new Date().toLocaleTimeString()+' '+s;rows.push(line);logEl.textContent=rows.join('\n');logEl.scrollTop=logEl.scrollHeight}
function snap(){return `ready=${p.readyState}; network=${p.networkState}; time=${Number(p.currentTime||0).toFixed(2)}; paused=${p.paused}; error=${p.error?p.error.code:'none'}`}
async function startTone(){try{if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')await ctx.resume();stopTone(false);osc=ctx.createOscillator();gain=ctx.createGain();osc.type='sine';osc.frequency.value=440;gain.gain.value=0.08;osc.connect(gain);gain.connect(ctx.destination);osc.start();document.getElementById('toneStatus').textContent='測試音已啟動；請確認是否聽到嗶聲';log('LOCAL TONE started; AudioContext='+ctx.state+'; sampleRate='+ctx.sampleRate)}catch(e){document.getElementById('toneStatus').textContent='測試音啟動失敗：'+e.name;log('LOCAL TONE ERROR '+e.name+': '+e.message)}}
function stopTone(write=true){try{if(osc){osc.stop();osc.disconnect();osc=null}if(gain){gain.disconnect();gain=null}if(write){document.getElementById('toneStatus').textContent='測試音已停止';log('LOCAL TONE stopped')}}catch(e){if(write)log('STOP ERROR '+e.message)}}
function setStream(name,url){p.pause();p.removeAttribute('src');p.load();p.src=url;p.load();document.getElementById('streamStatus').textContent='已載入 '+name+'；請按原生播放鍵';log('STREAM source set '+name+': '+url)}
['loadstart','loadedmetadata','loadeddata','canplay','play','playing','pause','waiting','stalled','progress','timeupdate','error','abort','emptied','durationchange'].forEach(ev=>p.addEventListener(ev,()=>{log('STREAM event='+ev+'; '+snap());document.getElementById('streamStatus').textContent='最近事件：'+ev+'；'+snap()}));
async function copyLog(){const t=rows.join('\n')+'\nFINAL '+snap()+'; audioContext='+(ctx?ctx.state:'not-created');try{await navigator.clipboard.writeText(t);document.getElementById('streamStatus').textContent='紀錄已複製'}catch(e){document.getElementById('streamStatus').textContent='請長按紀錄文字複製'}}function clearLog(){rows=[];logEl.textContent='';log('V253 log cleared')}log('V253 ready');
</script></main></body></html>
