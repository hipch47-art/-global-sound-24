<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GLOBAL SOUND 24｜V251 播放手勢測試</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#101116;color:#f4f4f6;margin:0;padding:20px;line-height:1.5}main{max-width:680px;margin:auto}h1{font-size:23px}p,.hint{color:#b9bac5}.card{background:#1b1d25;border:1px solid #343643;border-radius:14px;padding:16px;margin:14px 0}button{background:#d9b18c;color:#17151a;border:0;border-radius:10px;padding:12px 14px;font-size:16px;font-weight:650;margin:5px 4px 5px 0}button.secondary{background:#343643;color:white}audio{width:100%;margin-top:10px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0a0b0f;padding:12px;border-radius:10px;max-height:280px;overflow:auto;font-size:12px}.status{font-weight:700;color:#e4bd97}</style></head>
<body><main><h1>GLOBAL SOUND 24｜V251 播放手勢對照測試</h1><p>目的：比較「按鈕直接播放」與「先載入再按原生播放鍵」。每次測試約等 5 秒，請確認是否真的聽到聲音。</p>
<div class="card"><h2>測試 A｜按鈕直接播放</h2><p>播放動作直接發生在你的點擊操作內。</p><button onclick="direct('Fluid','https://ice1.somafm.com/fluid-128-aac')">播放 Fluid（A）</button><button onclick="direct('Seven Inch Soul','https://ice1.somafm.com/7soul-128-aac')">播放 Seven Inch Soul（A）</button></div>
<div class="card"><h2>測試 B｜先載入，再按原生播放鍵</h2><button class="secondary" onclick="loadOnly('Fluid','https://ice1.somafm.com/fluid-128-aac')">載入 Fluid（B）</button><button class="secondary" onclick="loadOnly('Seven Inch Soul','https://ice1.somafm.com/7soul-128-aac')">載入 Seven Inch Soul（B）</button><audio id="player" controls playsinline preload="none"></audio><p class="hint">載入後請按上方播放器的播放鍵。</p></div>
<div class="card"><h2>診斷狀態</h2><div id="status" class="status">尚未測試</div><p id="details" class="hint"></p><button class="secondary" onclick="copyLog()">複製診斷紀錄</button><button class="secondary" onclick="clearLog()">清除紀錄</button><pre id="log"></pre></div>
<p class="hint">注意：這是獨立測試頁，不會修改正式版 index.html。音源為 SomaFM 公開串流，測試結果不代表已取得商業再散布授權。</p></main>
<script>
const player=document.getElementById('player'),logEl=document.getElementById('log'),statusEl=document.getElementById('status'),detailsEl=document.getElementById('details');let lines=[];function log(s){let t=new Date().toLocaleTimeString();lines.push(t+' '+s);logEl.textContent=lines.join('\n');logEl.scrollTop=logEl.scrollHeight;}function state(label){statusEl.textContent=label;detailsEl.textContent=`readyState=${player.readyState} networkState=${player.networkState} currentTime=${Number(player.currentTime||0).toFixed(2)}s error=${player.error?player.error.code:'none'}`;}['loadstart','loadedmetadata','loadeddata','canplay','canplaythrough','play','playing','pause','waiting','stalled','suspend','progress','timeupdate','error','abort','emptied','durationchange'].forEach(ev=>player.addEventListener(ev,()=>{log(`B player event=${ev}; ready=${player.readyState}; network=${player.networkState}; time=${Number(player.currentTime||0).toFixed(2)}; error=${player.error?player.error.code:'none'}`);state('最近事件：'+ev)}));async function direct(name,url){try{player.pause();player.removeAttribute('src');player.load();player.src=url;player.load();log(`A ${name}: set src ${url}`);state('A：正在嘗試播放 '+name);let p=player.play();if(p&&p.then)await p;log(`A ${name}: play() promise resolved`);state('A：play() 已啟動，請確認是否有聲音');}catch(e){log(`A ${name}: play() rejected ${e.name}: ${e.message}`);state('A：播放啟動失敗 '+e.name)}}function loadOnly(name,url){player.pause();player.src=url;player.load();log(`B ${name}: source set ${url}; 請按原生播放鍵`);state('B：已載入 '+name+'，請按播放器播放鍵')}async function copyLog(){let text=lines.join('\n')+'\nFINAL readyState='+player.readyState+' networkState='+player.networkState+' currentTime='+Number(player.currentTime||0).toFixed(2)+' error='+(player.error?player.error.code:'none');try{await navigator.clipboard.writeText(text);statusEl.textContent='診斷紀錄已複製';}catch(e){statusEl.textContent='無法自動複製，請長按紀錄文字複製';}log('--- copy requested ---')}function clearLog(){lines=[];logEl.textContent='';statusEl.textContent='紀錄已清除';detailsEl.textContent='';}setInterval(()=>{if(player.src)state(statusEl.textContent)},1000);log('V251 ready');
</script></body></html>
