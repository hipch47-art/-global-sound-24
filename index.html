<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090909">
<title>GLOBAL SOUND 24 V162</title>
<style>
:root{--bg:#090909;--card:#151515;--line:#292929;--text:#f5f5f5;--muted:#9a9a9a;--accent:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Noto Sans TC",sans-serif}
button{font:inherit;color:inherit}main{max-width:760px;margin:auto;padding:24px 18px 100px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}
.logo{font-size:18px;font-weight:750;letter-spacing:.08em}.gear{border:1px solid var(--line);background:#111;border-radius:50%;width:42px;height:42px}
h1{font-size:32px;margin:8px 0 22px}.section{margin-top:30px}.section h2{font-size:19px;margin:0 0 13px}.sub{font-size:13px;color:var(--muted);margin-top:-7px;margin-bottom:13px}
.music-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.music-head{position:relative;display:block;margin-bottom:10px;min-height:54px}.music-title{padding-top:2px;padding-right:42%}.region-box{position:absolute;right:0;top:-4px;width:40%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;border:1px solid #292929;background:#111;border-radius:16px;padding:9px}.region-chip{display:flex;align-items:center;justify-content:flex-start;gap:4px;border:1px solid #303030;background:#181818;color:#aaa;border-radius:8px;padding:4px 5px;min-height:29px;cursor:pointer;font-size:11px;white-space:nowrap}.region-chip input{width:13px;height:13px;margin:0;accent-color:#1976ff}.region-chip.on{border-color:#1976ff;background:rgba(25,118,255,.12);box-shadow:0 0 0 1px rgba(25,118,255,.12)}.region-chip .flag{font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tile{position:relative;overflow:hidden;border:1px solid var(--line);background:linear-gradient(145deg,#171717,#111);border-radius:16px;padding:18px 12px;min-height:118px;text-align:left;cursor:pointer}.tile:after{content:'';position:absolute;right:-12px;bottom:-18px;width:120px;height:120px;border:1px solid rgba(255,255,255,.08);border-radius:50%;box-shadow:0 0 0 12px rgba(255,255,255,.018),0 0 0 25px rgba(255,255,255,.012);pointer-events:none}.tile .motif{position:absolute;right:13px;top:12px;color:rgba(255,255,255,.16);font-size:42px;line-height:1;pointer-events:none}.tile .motif-lines{position:absolute;right:8px;bottom:12px;width:88px;height:28px;opacity:.12;background:repeating-linear-gradient(to bottom,transparent 0 5px,#fff 5px 6px);transform:skewY(-7deg);pointer-events:none}.tile b{position:relative;z-index:2}.tile span{position:relative;z-index:2;font-size:27px}.tile:active{transform:scale(.985)}.tile b{display:block;font-size:16px;margin-top:10px}.tile span{font-size:25px}
.hot{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.hot button{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:15px;text-align:left;min-height:76px;cursor:pointer}.hot strong{display:block;font-size:15px}.hot small{display:block;color:var(--muted);margin-top:5px}
.genre{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.genre button{white-space:nowrap;border:1px solid var(--line);background:#111;border-radius:999px;padding:10px 14px;cursor:pointer}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:flex-end;justify-content:center;padding:14px}.sheet{width:min(700px,100%);background:#171717;border:1px solid var(--line);border-radius:22px;padding:20px}.sheettop{display:flex;justify-content:space-between;align-items:center}.close{background:#242424;border:0;border-radius:50%;width:38px;height:38px}.countries label{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line)}.countries input{width:20px;height:20px}.actions{display:flex;gap:8px;margin-top:12px}.actions button{border:1px solid var(--line);background:#242424;border-radius:10px;padding:9px 12px}
.player{margin-top:28px;border:1px solid var(--line);border-radius:20px;padding:18px;background:linear-gradient(145deg,#181818,#101010)}.turn{width:min(260px,68vw);aspect-ratio:1;margin:4px auto 18px;border-radius:50%;background:repeating-radial-gradient(circle,#0b0b0b 0 2px,#202020 2px 3px,#0d0d0d 3px 5px);box-shadow:0 0 0 10px #111,0 16px 35px #000;position:relative;animation:spin 4s linear infinite}.turn:after{content:"";position:absolute;inset:40%;background:#333;border-radius:50%;box-shadow:0 0 0 7px #111}.needle{position:absolute;right:-18px;top:17px;width:105px;height:6px;background:#aaa;border-radius:6px;transform:rotate(25deg);transform-origin:right center}.playername{text-align:center;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.play{display:block;margin:15px auto 0;border:0;background:#eee;color:#111;border-radius:50%;width:54px;height:54px}
@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:600px){.music-head{min-height:54px}.music-title{padding-right:43%}.region-box{top:-4px;right:0;width:41%;grid-template-columns:1fr 1fr;padding:5px;gap:3px}.region-chip{font-size:10px;padding:3px 4px;min-height:26px;gap:3px;border-radius:7px}.region-chip input{width:12px;height:12px}.region-chip .flag{font-size:12px}} @media(max-width:480px){main{padding-top:18px}.grid{grid-template-columns:1fr 1fr}.hot{grid-template-columns:1fr 1fr}h1{font-size:29px}}
</style>
</head>
<body>
<main>
<header><div class="logo">GLOBAL SOUND 24</div><button class="gear" id="settings">⚙︎</button></header>
<h1>想聽什麼？</h1>

<section class="section">
<div class="music-head">
  <div class="music-title">
    <h2 style="margin:0">🎵 音樂類型</h2>
    <div class="sub" style="margin-top:5px;margin-bottom:0">勾選地區後，只顯示該地區的音樂來源</div>
  </div>
  <div class="region-box" id="inlineRegions" aria-label="來源地區"></div>
</div>
<div class="grid">
<button class="tile" data-genre="Instrumental"><span>🎼</span><i class="motif">♪</i><i class="motif-lines"></i><b>純音樂</b></button>
<button class="tile" data-genre="R&B"><span>🎤</span><i class="motif">〰</i><i class="motif-lines"></i><b>R&B</b></button>
<button class="tile" data-genre="Jazz"><span>🎷</span><i class="motif">♬</i><i class="motif-lines"></i><b>Jazz</b></button>
<button class="tile" data-genre="Classical"><span>🎻</span><i class="motif">𝄞</i><i class="motif-lines"></i><b>Classical</b></button>
<button class="tile" data-genre="Piano"><span>🎹</span><i class="motif">▥</i><i class="motif-lines"></i><b>Piano</b></button>
<button class="tile" data-genre="Rock"><span>🎸</span><i class="motif">⚡</i><i class="motif-lines"></i><b>Rock</b></button>
</div>
</section>

<section class="section">
<h2>🔥 熱門音樂</h2>
<div class="sub">依你選擇的地區，自動顯示對應熱門音樂</div>
<div class="hot" id="hotMusic"></div>
</section>

<section class="section">
<h2>為你推薦</h2>
<div class="genre">
<button data-genre="Jazz">Jazz</button><button data-genre="Piano">Piano</button><button data-genre="Rock">Rock</button><button data-genre="Ambient">Ambient</button><button data-genre="Lo-fi">Lo-fi</button>
</div>
</section>

<div class="player" id="player">
<div class="turn"><div class="needle"></div></div>
<div class="playername" id="playername">選擇一個聲音開始播放</div>
<button class="play" id="play">▶</button>
</div>
</main>

<div class="overlay" id="countryOverlay">
<div class="sheet">
<div class="sheettop"><div><b>來源地區</b><div style="font-size:13px;color:#999;margin-top:4px">預設全部選取</div></div><button class="close" id="closeCountry">×</button></div>
<div class="actions"><button id="all">全部勾選</button><button id="none">全部取消</button></div>
<div class="countries" id="countries"></div>
</div></div>

<div class="overlay" id="settingsOverlay">
<div class="sheet"><div class="sheettop"><b>Settings</b><button class="close" id="closeSettings">×</button></div>
<div style="margin-top:18px">
  <div style="font-weight:650;margin-bottom:8px">語言 / Language</div>
  <div style="color:#999;font-size:13px;margin-bottom:10px">介面語言只提供目前六個地區的語言</div>
  <select id="languageSelect" style="width:100%;background:#222;color:#fff;border:1px solid #333;border-radius:12px;padding:13px 12px;font-size:16px">
    <option value="zh-TW">🇹🇼 繁體中文</option>
    <option value="zh-CN">🇨🇳 简体中文</option>
    <option value="ja-JP">🇯🇵 日本語</option>
    <option value="ko-KR">🇰🇷 한국어</option>
    <option value="en-US">🇺🇸 English (US)</option>
    <option value="en-GB">🇬🇧 English (UK)</option>
  </select>
</div>
<p style="color:#aaa;font-size:14px;line-height:1.6">V173 · 曲風卡片音樂元素強化<br>地區已從首頁移除，音樂類型使用右上角國家篩選。</p>
</div></div>

<script>
const countries=[['TW','🇹🇼','台灣'],['CN','🇨🇳','中國'],['JP','🇯🇵','日本'],['KR','🇰🇷','韓國'],['US','🇺🇸','美國'],['GB','🇬🇧','英國']];
const hotByCountry={
 TW:[['🎵','台灣熱門歌曲','近期熱門流行音樂'],['🎤','華語流行','華語熱門歌曲'],['🏆','台灣熱門排行','熱門歌曲排行'],['📱','短影音熱門','近期短影音熱門歌曲']],
 CN:[['🎵','抖音熱門','抖音熱門歌曲'],['🎤','華語流行','華語熱門歌曲'],['🏆','中國熱門排行','熱門歌曲排行'],['📱','短影音熱門','近期短影音熱門歌曲']],
 JP:[['🎵','J-POP 熱門','日本熱門流行音樂'],['🎤','日本熱門歌曲','近期熱門歌曲'],['🏆','日本熱門排行','熱門歌曲排行'],['📱','短影音熱門','日本短影音熱門歌曲']],
 KR:[['🎵','K-POP 熱門','韓國熱門流行音樂'],['🎤','韓國熱門歌曲','近期熱門歌曲'],['🏆','韓國熱門排行','熱門歌曲排行'],['📱','短影音熱門','韓國熱門歌曲']],
 US:[['🎵','US Top Hits','美國熱門歌曲'],['🎤','US Pop Hits','美國流行音樂'],['🏆','US Music Charts','美國熱門排行'],['📱','TikTok US Hits','美國短影音熱門歌曲']],
 GB:[['🎵','UK Top Hits','英國熱門歌曲'],['🎤','UK Pop Hits','英國流行音樂'],['🏆','UK Music Charts','英國熱門排行'],['📱','UK Viral Hits','英國熱門短影音歌曲']]
};
const selected=new Set(countries.map(x=>x[0]));
const countryOverlay=document.getElementById('countryOverlay');
const countriesBox=document.getElementById('countries');
const inlineRegions=document.getElementById('inlineRegions');

function renderHotMusic(){
  const box=document.getElementById('hotMusic');
  if(!box)return;
  const ids=[...selected];
  if(!ids.length){
    box.innerHTML='<div style="color:#999;padding:14px 0">請至少選擇一個地區</div>';
    return;
  }
  const cards=[];
  ids.forEach(id=>(hotByCountry[id]||[]).forEach(item=>cards.push(`<button type="button" data-hot="${item[1]}"><strong>${item[0]} ${item[1]}</strong><small>${item[2]}</small></button>`)));
  box.innerHTML=cards.slice(0,8).join('');
  box.querySelectorAll('[data-hot]').forEach(b=>b.addEventListener('click',()=>playName(b.dataset.hot)));
}

function renderInlineRegions(){
  if(!inlineRegions)return;
  inlineRegions.innerHTML=countries.map(([id,flag,name])=>`<label class="region-chip ${selected.has(id)?'on':''}"><input type="checkbox" data-inline-id="${id}" ${selected.has(id)?'checked':''}><span class="flag">${flag}</span><span>${name}</span></label>`).join('');
  inlineRegions.querySelectorAll('input').forEach(i=>i.addEventListener('change',()=>{
    if(i.checked) selected.add(i.dataset.inlineId); else selected.delete(i.dataset.inlineId);
    i.closest('.region-chip').classList.toggle('on',i.checked);
    renderHotMusic();
  }));
}

function drawCountries(){
  if(!countriesBox)return;
  countriesBox.innerHTML=countries.map(([id,flag,name])=>`<label><input type="checkbox" data-id="${id}" ${selected.has(id)?'checked':''}><span style="font-size:22px">${flag}</span><span>${name}</span></label>`).join('');
  countriesBox.querySelectorAll('input').forEach(i=>i.addEventListener('change',()=>{
    if(i.checked) selected.add(i.dataset.id); else selected.delete(i.dataset.id);
    renderInlineRegions();
    renderHotMusic();
  }));
}
drawCountries();
renderInlineRegions();
renderHotMusic();
function playName(name){document.getElementById('playername').textContent=name+' · '+[...selected].map(id=>countries.find(x=>x[0]===id)[2]).join('＋');document.getElementById('play').textContent='❚❚';}
document.querySelectorAll('[data-genre]').forEach(b=>b.onclick=()=>playName(b.dataset.genre));

document.getElementById('closeCountry').onclick=()=>countryOverlay.style.display='none';
document.getElementById('all').onclick=()=>{countries.forEach(x=>selected.add(x[0]));drawCountries();drawInlineRegions();renderHotMusic();updateRegionCount()};
document.getElementById('none').onclick=()=>{selected.clear();drawCountries();drawInlineRegions();renderHotMusic();updateRegionCount()};
updateRegionCount();
document.getElementById('play').onclick=()=>{document.getElementById('play').textContent=document.getElementById('play').textContent==='▶'?'❚❚':'▶'};
</script>
</body>
</html>
