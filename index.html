<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090909">
<title>GLOBAL SOUND 24 V162</title>
<style>
:root{--bg:#090909;--card:#151515;--line:#292929;--text:#f5f5f5;--muted:#9a9a9a;--accent:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Noto Sans TC",sans-serif}
button{font:inherit;color:inherit}main{max-width:760px;margin:auto;padding:24px 18px 100px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}
.logo{font-size:18px;font-weight:750;letter-spacing:.08em}.gear{border:1px solid var(--line);background:#111;border-radius:50%;width:42px;height:42px}
h1{font-size:32px;margin:8px 0 22px}.section{margin-top:30px}.section h2{font-size:19px;margin:0 0 13px}.sub{font-size:13px;color:var(--muted);margin-top:-7px;margin-bottom:13px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tile{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:18px 12px;min-height:92px;text-align:left;cursor:pointer}.tile b{display:block;font-size:16px;margin-top:10px}.tile span{font-size:25px}
.hot{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.hot button{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:15px;text-align:left;min-height:76px;cursor:pointer}.hot strong{display:block;font-size:15px}.hot small{display:block;color:var(--muted);margin-top:5px}
.genre{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.genre button{white-space:nowrap;border:1px solid var(--line);background:#111;border-radius:999px;padding:10px 14px;cursor:pointer}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:flex-end;justify-content:center;padding:14px}.sheet{width:min(700px,100%);background:#171717;border:1px solid var(--line);border-radius:22px;padding:20px}.sheettop{display:flex;justify-content:space-between;align-items:center}.close{background:#242424;border:0;border-radius:50%;width:38px;height:38px}.countries label{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line)}.countries input{width:20px;height:20px}.actions{display:flex;gap:8px;margin-top:12px}.actions button{border:1px solid var(--line);background:#242424;border-radius:10px;padding:9px 12px}
.player{margin-top:28px;border:1px solid var(--line);border-radius:20px;padding:18px;background:linear-gradient(145deg,#181818,#101010)}.turn{width:min(260px,68vw);aspect-ratio:1;margin:4px auto 18px;border-radius:50%;background:repeating-radial-gradient(circle,#0b0b0b 0 2px,#202020 2px 3px,#0d0d0d 3px 5px);box-shadow:0 0 0 10px #111,0 16px 35px #000;position:relative;animation:spin 4s linear infinite}.turn:after{content:"";position:absolute;inset:40%;background:#333;border-radius:50%;box-shadow:0 0 0 7px #111}.needle{position:absolute;right:-18px;top:17px;width:105px;height:6px;background:#aaa;border-radius:6px;transform:rotate(25deg);transform-origin:right center}.playername{text-align:center;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.play{display:block;margin:15px auto 0;border:0;background:#eee;color:#111;border-radius:50%;width:54px;height:54px}
@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:480px){main{padding-top:18px}.grid{grid-template-columns:1fr 1fr}.hot{grid-template-columns:1fr 1fr}h1{font-size:29px}}
</style>
</head>
<body>
<main>
<header><div class="logo">GLOBAL SOUND 24</div><button class="gear" id="settings">⚙︎</button></header>
<h1>想聽什麼？</h1>

<section class="section">
<h2>音樂類型</h2>
<div class="sub">選擇曲風，再用右上角國家篩選來源</div>
<div class="grid">
<button class="tile" data-genre="Instrumental"><span>🎼</span><b>純音樂</b></button>
<button class="tile" data-genre="R&B"><span>🎤</span><b>R&B</b></button>
<button class="tile" data-genre="Jazz"><span>🎷</span><b>Jazz</b></button>
<button class="tile" data-genre="Classical"><span>🎻</span><b>Classical</b></button>
<button class="tile" data-genre="Piano"><span>🎹</span><b>Piano</b></button>
<button class="tile" data-genre="Rock"><span>🎸</span><b>Rock</b></button>
</div>
</section>

<section class="section">
<h2>🔥 熱門音樂</h2>
<div class="sub">快速找到最近大家正在聽的內容</div>
<div class="hot">
<button data-hot="抖音神曲"><strong>🎵 抖音神曲</strong><small>熱門短影音歌曲</small></button>
<button data-hot="2026熱門"><strong>🔥 2026 熱門</strong><small>近期熱門歌曲</small></button>
<button data-hot="2026金曲排行"><strong>🏆 2026 金曲排行</strong><small>熱門排行入口</small></button>
<button data-hot="台灣熱門"><strong>🇹🇼 台灣熱門</strong><small>Trending Taiwan</small></button>
</div>
</section>

<section class="section">
<h2>為你推薦</h2>
<div class="genre">
<button data-genre="Jazz">Jazz</button><button data-genre="Piano">Piano</button><button data-genre="Rock">Rock</button><button data-genre="Ambient">Ambient</button><button data-genre="Lo-fi">Lo-fi</button>
</div>
</section>

<div class="player" id="player">
<div class="turn"><div class="needle"></div></div>
<div class="playername" id="playername">選擇一個聲音開始播放</div>
<button class="play" id="play">▶</button>
</div>
</main>

<div class="overlay" id="countryOverlay">
<div class="sheet">
<div class="sheettop"><div><b>來源地區</b><div style="font-size:13px;color:#999;margin-top:4px">預設全部選取</div></div><button class="close" id="closeCountry">×</button></div>
<div class="actions"><button id="all">全部勾選</button><button id="none">全部取消</button></div>
<div class="countries" id="countries"></div>
</div></div>

<div class="overlay" id="settingsOverlay">
<div class="sheet"><div class="sheettop"><b>Settings</b><button class="close" id="closeSettings">×</button></div>
<p style="color:#aaa;font-size:14px;line-height:1.6">V162 · 首頁資訊架構更新<br>地區已從首頁移除，音樂類型使用右上角國家篩選。</p>
</div></div>

<script>
const countries=[['TW','🇹🇼','台灣'],['CN','🇨🇳','中國'],['JP','🇯🇵','日本'],['HK','🇭🇰','香港'],['US','🇺🇸','美國'],['GB','🇬🇧','英國']];
const selected=new Set(countries.map(x=>x[0]));
const countryOverlay=document.getElementById('countryOverlay');
const countriesBox=document.getElementById('countries');
function drawCountries(){countriesBox.innerHTML=countries.map(([id,flag,name])=>`<label><input type="checkbox" data-id="${id}" ${selected.has(id)?'checked':''}><span style="font-size:22px">${flag}</span><span>${name}</span></label>`).join('');countriesBox.querySelectorAll('input').forEach(i=>i.onchange=()=>{i.checked?selected.add(i.dataset.id):selected.delete(i.dataset.id)});}
drawCountries();

document.getElementById('settings').onclick=()=>document.getElementById('settingsOverlay').style.display='flex';
document.getElementById('closeSettings').onclick=()=>document.getElementById('settingsOverlay').style.display='none';

function playName(name){document.getElementById('playername').textContent=name+' · '+[...selected].map(id=>countries.find(x=>x[0]===id)[2]).join('＋');document.getElementById('play').textContent='❚❚';}
document.querySelectorAll('[data-genre]').forEach(b=>b.onclick=()=>{playName(b.dataset.genre);countryOverlay.style.display='flex';});
document.querySelectorAll('[data-hot]').forEach(b=>b.onclick=()=>playName(b.dataset.hot));
document.getElementById('closeCountry').onclick=()=>countryOverlay.style.display='none';
document.getElementById('all').onclick=()=>{countries.forEach(x=>selected.add(x[0]));drawCountries()};
document.getElementById('none').onclick=()=>{selected.clear();drawCountries()};
document.getElementById('play').onclick=()=>{document.getElementById('play').textContent=document.getElementById('play').textContent==='▶'?'❚❚':'▶'};
</script>
</body>
</html>
