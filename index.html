<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080808"><title>GLOBAL SOUND 24 V175</title>
<style>
:root{--bg:#080808;--card:#111;--line:#302a27;--text:#fff9f4;--muted:#b9aaa2;--rose:#d8a18b;--blue:#1976ff}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Noto Sans TC",sans-serif}button{font:inherit;color:inherit}
main{max-width:820px;margin:auto;padding:22px 18px 100px}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-size:19px;font-weight:800;letter-spacing:.12em}.gear{width:44px;height:44px;border:1px solid #322e2c;background:#101010;border-radius:50%}
h1,h2,.tile-title,.tile-en,.hot strong{background:linear-gradient(110deg,#fffdfb 0%,#f8eee8 45%,#d79d84 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
h1{font-family:Georgia,"Times New Roman","Noto Serif TC",serif;font-size:42px;line-height:1.08;margin:54px 0 34px;letter-spacing:.02em}.section{margin-top:30px}.music-head{position:relative;min-height:92px;margin-bottom:14px}.music-title{padding-right:260px}.music-title h2{font-family:Georgia,"Times New Roman","Noto Serif TC",serif;font-size:27px;margin:0 0 8px}.sub{font-size:14px;color:var(--muted);margin:0;line-height:1.5}
.region-box{position:absolute;right:0;top:-4px;width:244px;display:grid;grid-template-columns:1fr 1fr;gap:5px;border:1px solid #3b3430;background:rgba(17,17,17,.94);border-radius:15px;padding:7px}.region-chip{display:flex;align-items:center;gap:5px;border:1px solid #3b3633;background:#151515;color:#aaa;border-radius:9px;padding:5px 6px;min-height:29px;cursor:pointer;font-size:11px;white-space:nowrap}.region-chip input{width:13px;height:13px;margin:0;accent-color:var(--blue)}.region-chip.on{border-color:var(--blue);background:rgba(25,118,255,.12);box-shadow:0 0 0 1px rgba(25,118,255,.1)}.flag{font-size:13px}.region-actions{grid-column:1/-1;display:flex;gap:5px}.region-actions button{flex:1;border:1px solid #37322f;background:#141414;color:#aaa;border-radius:7px;padding:3px;font-size:10px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.tile{position:relative;min-height:180px;border:1px solid #4a3b34;border-radius:20px;overflow:hidden;background:#111 center/cover no-repeat;cursor:pointer;box-shadow:0 12px 28px rgba(0,0,0,.28)}.tile:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.08) 10%,rgba(0,0,0,.12) 35%,rgba(0,0,0,.72) 100%)}.tile:after{content:"›";position:absolute;right:16px;bottom:14px;width:38px;height:38px;border:1px solid rgba(255,244,234,.45);border-radius:50%;display:grid;place-items:center;font-size:30px;font-weight:200;color:#fff8f3}.tile-content{position:absolute;left:18px;bottom:15px;right:60px}.tile-title{font-family:Georgia,"Times New Roman","Noto Serif TC",serif;font-size:27px;font-weight:700;line-height:1.05}.tile-en{font-size:10px;letter-spacing:.22em;margin-top:8px;text-transform:uppercase}.bar{width:38px;height:3px;background:linear-gradient(90deg,#fffdfb,#d79d84);margin-top:10px;border-radius:3px}.hot{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hot button{position:relative;min-height:92px;border:1px solid #403630;border-radius:17px;overflow:hidden;background:#111 center/cover no-repeat;text-align:left;padding:16px 18px}.hot button:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.78),rgba(0,0,0,.28))}.hot .inside{position:relative;z-index:1}.hot strong{display:block;font-family:Georgia,"Times New Roman","Noto Serif TC",serif;font-size:18px}.hot small{display:block;color:#c9bbb4;margin-top:6px}
.source-list{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.source-card{border:1px solid #302b28;background:linear-gradient(145deg,#171717,#101010);border-radius:16px;padding:14px;cursor:pointer}.source-card strong{display:block;font-size:15px}.source-card small{display:block;color:#999;margin-top:5px;line-height:1.4}.source-card .source-meta{margin-top:9px;color:#d7a58e;font-size:12px}.audio-panel{margin-top:14px;border:1px solid #3a302b;background:#101010;border-radius:17px;padding:14px}.audio-panel .now{font-size:14px;margin-bottom:9px;color:#e7d8d0}.audio-panel audio{width:100%}.test-note{font-size:11px;color:#777;line-height:1.5;margin-top:10px}
.player{margin-top:28px;border:1px solid #3a302b;border-radius:22px;padding:20px;background:linear-gradient(145deg,#181412,#0e0d0c)}.turn-wrap{position:relative;width:min(270px,72vw);margin:4px auto 20px}.turn{width:100%;aspect-ratio:1;border-radius:50%;background:repeating-radial-gradient(circle,#090909 0 2px,#25201d 2px 3px,#0c0c0c 3px 5px);box-shadow:0 0 0 10px #111,0 18px 38px #000;position:relative}.turn.spinning{animation:spin 3.2s linear infinite}.turn:after{content:"";position:absolute;inset:42%;background:#c79b83;border-radius:50%;box-shadow:0 0 0 7px #111}.needle{position:absolute;right:-9px;top:12px;width:105px;height:6px;background:#bca69b;border-radius:6px;transform:rotate(25deg);transform-origin:right center;transition:.35s}.needle.down{transform:rotate(47deg)}.playername{text-align:center;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.play{display:block;margin:15px auto 0;border:0;background:linear-gradient(135deg,#fff,#d79d84);color:#111;border-radius:50%;width:54px;height:54px;font-weight:700}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:flex-end;justify-content:center;padding:14px}.sheet{width:min(700px,100%);background:#171513;border:1px solid #332c29;border-radius:22px;padding:20px}.sheettop{display:flex;justify-content:space-between;align-items:center}.close{background:#24201e;border:0;border-radius:50%;width:38px;height:38px}.countries label{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid #302a27}.countries input{width:20px;height:20px}.actions{display:flex;gap:8px;margin-top:12px}.actions button{border:1px solid #3a312d;background:#24201e;border-radius:10px;padding:9px 12px}
@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:650px){main{padding:18px 18px 90px}.logo{font-size:17px}h1{font-size:38px;margin-top:48px}.music-head{min-height:152px}.music-title{padding-right:0}.region-box{position:relative;top:auto;right:auto;width:100%;margin-top:14px}.grid{gap:10px}.tile{min-height:155px}.tile-title{font-size:24px}}@media(max-width:480px){h1{font-size:34px}.tile{min-height:148px}.tile-title{font-size:22px}.hot{grid-template-columns:1fr}.source-list{grid-template-columns:1fr}}
</style></head><body><main>
<header class="top"><div class="logo">GLOBAL SOUND 24</div><button class="gear" id="settings">⚙︎</button></header>
<h1>想聽什麼？</h1>
<section class="section"><div class="music-head"><div class="music-title"><h2>🎵 音樂類型</h2><p class="sub">勾選地區後，只顯示該地區的音樂來源</p></div>
<div class="region-box" id="regions"></div></div>
<div class="grid" id="genres"></div></section>
<section class="section"><div class="music-title"><h2>🔥 熱門音樂</h2><p class="sub">依你選擇的地區，自動顯示對應熱門音樂</p></div><div class="hot" id="hot"></div></section>
<section class="section" id="sourcesSection"><div class="music-title"><h2>🎧 測試音樂來源</h2><p class="sub">目前為功能測試來源，點選後直接播放</p></div><div class="source-list" id="sources"></div><div class="audio-panel"><div class="now" id="now">尚未選擇音樂</div><audio id="audio" controls preload="none"></audio></div><div class="test-note">測試來源僅用於確認播放鏈路；公開串流不等於第三方商業使用授權。正式版需另行完成來源與權利審核。</div></section>
<section class="player"><div class="turn-wrap"><div class="turn" id="turn"></div><div class="needle" id="needle"></div></div><div class="playername" id="playername">GLOBAL SOUND 24 · Ready</div><button class="play" id="play">▶</button></section>
</main>
<div class="overlay" id="overlay"><div class="sheet"><div class="sheettop"><strong>Settings</strong><button class="close" id="close">×</button></div><p style="color:#aaa">V175 測試版</p></div></div>
<script>
const countries=[['tw','🇹🇼','台灣'],['cn','🇨🇳','中國'],['jp','🇯🇵','日本'],['kr','🇰🇷','韓國'],['us','🇺🇸','美國'],['uk','🇬🇧','英國']];
let selected=new Set(countries.map(x=>x[0])); let currentGenre='';
const genres=[
 ['instrumental','純音樂','INSTRUMENTAL','instrumental.jpg'],['rnb','R&B','R&B / SOUL','rnb.jpg'],['jazz','Jazz','JAZZ MUSIC','jazz.jpg'],['classical','Classical','CLASSICAL MUSIC','classical.jpg'],['piano','Piano','PIANO MUSIC','piano.jpg'],['rock','Rock','ROCK MUSIC','rock.jpg']
];
const testSources=[
 {c:'us',g:'jazz',name:'Jazz24 · Live Jazz',meta:'USA · Jazz · 128 kbps',url:'https://knkx-live-a.edge.audiocdn.com/6285_128k'},
 {c:'us',g:'ambient',name:'SomaFM · Groove Salad',meta:'USA · Ambient / Chill',url:'https://ice.somafm.com/groovesalad'},
 {c:'us',g:'ambient',name:'SomaFM · Drone Zone',meta:'USA · Ambient / Drone',url:'https://ice.somafm.com/dronezone'},
 {c:'us',g:'rock',name:'SomaFM · Indie Pop Rocks!',meta:'USA · Indie / Rock',url:'https://ice.somafm.com/indiepop'},
 {c:'tw',g:'classical',name:'IC之音 · 百珊 FUN 音樂',meta:'台灣 · Classical · 官方節目頁',url:'https://www.ic975.com/programs/24/%E7%99%BE%E7%8F%8AFun%E9%9F%B3%E6%A8%82',external:true}
];
function renderRegions(){const box=document.getElementById('regions');box.innerHTML=countries.map(([id,f,n])=>`<label class="region-chip ${selected.has(id)?'on':''}"><input type="checkbox" ${selected.has(id)?'checked':''} data-id="${id}"><span class="flag">${f}</span><span>${n}</span></label>`).join('')+`<div class="region-actions"><button id="all">全選</button><button id="none">清除</button></div>`;box.querySelectorAll('input').forEach(i=>i.onchange=()=>{i.checked?selected.add(i.dataset.id):selected.delete(i.dataset.id);renderRegions();renderHot();renderSources()});document.getElementById('all').onclick=()=>{selected=new Set(countries.map(x=>x[0]));renderRegions();renderHot();renderSources()};document.getElementById('none').onclick=()=>{selected.clear();renderRegions();renderHot();renderSources()}}
function renderGenres(){document.getElementById('genres').innerHTML=genres.map(g=>`<button class="tile" data-g="${g[0]}" style="background-image:url('${g[3]}')"><div class="tile-content"><div class="tile-title">${g[1]}</div><div class="tile-en">${g[2]}</div><div class="bar"></div></div></button>`).join('');document.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{currentGenre=b.dataset.g;renderSources();document.getElementById('sourcesSection').scrollIntoView({behavior:'smooth'})})}
function hotItems(){const out=[]; if(selected.has('tw'))out.push(['tw','台灣熱門歌曲','華語流行熱門']);if(selected.has('cn'))out.push(['cn','抖音熱門','華語短影音熱門']);if(selected.has('jp'))out.push(['jp','J-POP 熱門','日本熱門歌曲']);if(selected.has('kr'))out.push(['kr','K-POP 熱門','韓國熱門歌曲']);if(selected.has('us'))out.push(['us','US Top Hits','US Pop Hits']);if(selected.has('uk'))out.push(['uk','UK Top Hits','UK Viral Hits']);return out.slice(0,4)}
function renderHot(){const h=document.getElementById('hot');h.innerHTML=hotItems().map((x,i)=>`<button style="background-image:url('${i%2?'hot2.jpg':'hot1.jpg'}')"><div class="inside"><strong>${x[1]}</strong><small>${x[2]}</small></div></button>`).join('')||'<div style="color:#777">請至少選擇一個地區</div>'}
function renderSources(){const s=document.getElementById('sources');let list=testSources.filter(x=>selected.has(x.c)&&(!currentGenre||x.g===currentGenre));if(!list.length)list=testSources.filter(x=>selected.has(x.c));s.innerHTML=list.map((x,i)=>`<button class="source-card" data-i="${testSources.indexOf(x)}"><strong>${x.name}</strong><small>${x.meta}</small><div class="source-meta">${x.external?'官方節目頁 ↗':'直接串流播放 ▶'}</div></button>`).join('')||'<div style="color:#777">目前沒有符合條件的測試來源</div>';s.querySelectorAll('.source-card').forEach(b=>b.onclick=()=>playSource(testSources[+b.dataset.i]))}
const audio=document.getElementById('audio'),turn=document.getElementById('turn'),needle=document.getElementById('needle'),now=document.getElementById('now'),playername=document.getElementById('playername');
function playSource(x){now.textContent=x.name;playername.textContent=x.name;if(x.external){window.open(x.url,'_blank');return}audio.src=x.url;audio.play().then(()=>{turn.classList.add('spinning');needle.classList.add('down')}).catch(()=>{turn.classList.remove('spinning');needle.classList.remove('down');now.textContent=x.name+' · 無法播放，請換下一個來源'})}
audio.addEventListener('playing',()=>{turn.classList.add('spinning');needle.classList.add('down')});audio.addEventListener('pause',()=>{turn.classList.remove('spinning');needle.classList.remove('down')});audio.addEventListener('error',()=>{turn.classList.remove('spinning');needle.classList.remove('down')});
document.getElementById('play').onclick=()=>audio.paused?audio.play():audio.pause();
const overlay=document.getElementById('overlay');document.getElementById('settings').onclick=()=>overlay.style.display='flex';document.getElementById('close').onclick=()=>overlay.style.display='none';
renderRegions();renderGenres();renderHot();renderSources();
</script></body></html>
