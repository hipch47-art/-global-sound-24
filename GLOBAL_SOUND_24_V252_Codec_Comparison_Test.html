<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GLOBAL SOUND 24｜V252 Codec 比較測試</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#101116;color:#f4f4f6;margin:0;padding:18px;line-height:1.5}main{max-width:720px;margin:auto}h1{font-size:23px}.card{background:#1b1d25;border:1px solid #343643;border-radius:14px;padding:15px;margin:14px 0}button{background:#d9b18c;color:#17151a;border:0;border-radius:10px;padding:11px 12px;font-size:15px;font-weight:650;margin:4px}button.alt{background:#343643;color:#fff}audio{width:100%;margin:10px 0}p,.hint{color:#b9bac5}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#090a0e;padding:12px;border-radius:10px;max-height:300px;overflow:auto;font-size:12px}.status{font-weight:700;color:#e4bd97}</style></head>
<body><main><h1>GLOBAL SOUND 24｜V252 Codec 比較測試</h1><p>目的：保持同一個 HTML5 播放器，對照 AAC 與 MP3 串流，確認問題是否與格式／串流端點有關。每次點擊後最多觀察 5 秒。</p>
<div class="card"><h2>播放器</h2><audio id="player" controls playsinline preload="none"></audio><div id="status" class="status">尚未測試</div><p id="detail" class="hint"></p></div>
<div class="card"><h2>Fluid</h2><button onclick="playTest('Fluid AAC 主站','https://ice5.somafm.com/fluid-128-aac')">AAC 主站</button><button onclick="playTest('Fluid AAC 備援','https://ice2.somafm.com/fluid-128-aac')">AAC 備援</button><button class="alt" onclick="playTest('Fluid MP3 主站','https://ice5.somafm.com/fluid-128-mp3')">MP3 主站</button><button class="alt" onclick="playTest('Fluid MP3 備援','https://ice2.somafm.com/fluid-128-mp3')">MP3 備援</button></div>
<div class="card"><h2>Seven Inch Soul</h2><button onclick="playTest('Seven Inch Soul AAC 主站','https://ice5.somafm.com/7soul-128-aac')">AAC 主站</button><button onclick="playTest('Seven Inch Soul AAC 備援','https://ice6.somafm.com/7soul-128-aac')">AAC 備援</button><button class="alt" onclick="playTest('Seven Inch Soul MP3 主站','https://ice5.somafm.com/7soul-128-mp3')">MP3 主站</button><button class="alt" onclick="playTest('Seven Inch Soul MP3 備援','https://ice6.somafm.com/7soul-128-mp3')">MP3 備援</button></div>
<div class="card"><h2>診斷紀錄</h2><button class="alt" onclick="copyLog()">複製診斷紀錄</button><button class="alt" onclick="clearLog()">清除紀錄</button><pre id="log"></pre></div>
<p class="hint">重要：此頁僅供個人技術除錯。SomaFM 官方串流頁標示直接串流連結僅供個人使用，未經授權不可用於遊戲或其他串流服務；因此即使測試成功，也不能直接視為 GLOBAL SOUND 24 可正式使用的音源。</p></main>
<script>
const p=document.getElementById('player'), logEl=document.getElementById('log'), statusEl=document.getElementById('status'), detail=document.getElementById('detail');let rows=[];
function log(s){const line=new Date().toLocaleTimeString()+' '+s;rows.push(line);logEl.textContent=rows.join('\n');logEl.scrollTop=logEl.scrollHeight}
function snapshot(){return `ready=${p.readyState}; network=${p.networkState}; time=${Number(p.currentTime||0).toFixed(2)}; paused=${p.paused}; error=${p.error?p.error.code:'none'}`}
['loadstart','loadedmetadata','loadeddata','canplay','canplaythrough','play','playing','pause','waiting','stalled','suspend','progress','timeupdate','error','abort','emptied','durationchange'].forEach(ev=>p.addEventListener(ev,()=>{log(`event=${ev}; ${snapshot()}`);statusEl.textContent='最近事件：'+ev;detail.textContent=snapshot()}));
async function playTest(name,url){p.pause();p.removeAttribute('src');p.load();p.src=url;log(`TEST ${name}: ${url}`);statusEl.textContent='嘗試播放：'+name;detail.textContent='等待播放結果（最多 5 秒）';try{p.load();const promise=p.play();if(promise&&promise.then)await promise;log(`play() promise resolved; ${name}; ${snapshot()}`)}catch(e){log(`play() rejected ${e.name}: ${e.message}; ${name}; ${snapshot()}`)}setTimeout(()=>{log(`CHECK +5s ${name}; ${snapshot()}`);statusEl.textContent='5 秒檢查：'+name;detail.textContent=snapshot()},5000)}
async function copyLog(){const text=rows.join('\n')+'\nFINAL '+snapshot();try{await navigator.clipboard.writeText(text);statusEl.textContent='紀錄已複製'}catch(e){statusEl.textContent='請長按紀錄文字複製'}}function clearLog(){rows=[];logEl.textContent='';statusEl.textContent='紀錄已清除';detail.textContent=''}log('V252 ready');
</script></body></html>
